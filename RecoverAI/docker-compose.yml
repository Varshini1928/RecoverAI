services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["5173:80"]
    depends_on: [backend]
    restart: unless-stopped

